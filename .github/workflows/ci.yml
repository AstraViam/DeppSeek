name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the target platform, so it is tested first and on the
        # widest range. Linux is included because the test suite must stay
        # platform-independent for contributors who are not on Windows.
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        exclude:
          - os: ubuntu-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Type check
        run: python -m mypy

      - name: Test
        run: python -m pytest -q

      - name: Bundle and verify it runs standalone
        run: python scripts/bundle.py --check

      - name: Verify the CLI starts without an API key
        run: python -m deppseek.cli --version
