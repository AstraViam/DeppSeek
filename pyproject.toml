[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deppseek"
version = "2.0.0"
description = "An approval-gated DeepSeek engineering agent for Windows/PowerShell with scientific-computing tooling"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AstraViam" }]
keywords = ["deepseek", "agent", "cli", "matlab", "engineering", "cfd"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "openai>=1.109.0",
  "rich>=13.7",
  "prompt_toolkit>=3.0.43",
  "pathspec>=0.12",
]

[project.optional-dependencies]
tui = ["textual>=0.60"]
units = ["pint>=0.23"]
notebook = ["nbformat>=5.9"]
mcp = ["mcp>=1.0"]
# MATLAB Engine API for Python, which gives a warm MATLAB workspace that
# persists variables across tool calls. MathWorks pins each engine release to
# one MATLAB release AND caps the interpreter: matlabengine 26.1.12 (R2026a)
# declares python_requires ">=3.9, <3.14". The marker below keeps `pip install`
# from failing outright on a newer interpreter; on 3.14+ the agent falls back to
# `matlab -batch` with journal replay instead.
matlab = ['matlabengine>=26.1,<27; python_version < "3.14"']
all = [
  "textual>=0.60",
  "pint>=0.23",
  "nbformat>=5.9",
  "mcp>=1.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
deppseek = "deppseek.cli:main"

[project.urls]
Homepage = "https://github.com/AstraViam/DeppSeek"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deppseek = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "SIM108"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
files = ["src/deppseek"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "windows: requires Windows",
  "matlab: requires a local MATLAB installation",
  "network: requires outbound network access",
]
